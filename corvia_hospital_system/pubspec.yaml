name: mycorvia
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  collection: ^1.19.1
  image: ^4.5.4
  zxing2: ^0.2.4

  # Face Recognition
  face_plugin: ^0.0.4
  image_picker: ^1.2.2
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  cupertino_icons: ^1.0.8

  # Environment / config
  flutter_dotenv: ^6.0.1

  # Supabase
  supabase_flutter: ^2.12.4
  realtime_client: ^2.7.3

  # QR generation + scanner
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  pretty_qr_code: ^3.6.0

  # PDF Generation
  pdf: ^3.12.0
  printing: ^5.14.3
  file_picker: ^11.0.2
  crypto: ^3.0.7

  # Sensors
  sensors_plus: ^7.0.0

  # Health Connect / HealthKit
  health: ^13.3.1

  # Speech / TTS
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0

  # Maps + Location
  geolocator: ^14.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # HTTP + URL
  http: ^1.6.0
  url_launcher: ^6.3.0

  # UI
  flutter_speed_dial: ^7.0.0

  # Local persistence
  shared_preferences: ^2.3.0

  # Date / number formatting
  intl: ^0.19.0

  # Logging
  logging: ^1.3.0

  # Biometric auth
  local_auth: ^3.0.1

  # Permissions + Audio + WebRTC
  permission_handler: ^12.0.3
  audioplayers: ^6.7.0
  flutter_webrtc: ^1.4.1

  # Device file paths
  path_provider: ^2.1.5
  app_settings: ^7.0.0

  # Reads the running build's version for the settings screen
  package_info_plus: ^9.0.1

  # Animations
  lottie: ^3.3.3
  shimmer: ^3.0.0

  # Local medication reminder notifications
  flutter_local_notifications: ^20.1.0
  timezone: 0.10.1
  flutter_timezone: ^5.1.0
  flutter_svg: ^2.3.0

dependency_overrides:
  speech_to_text_windows:
    path: packages/speech_to_text_windows

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^0.3.0

  # Lets the emergency tests swap PermissionHandlerPlatform for a fake.
  # The permission_handler facade deliberately does not re-export it.
  permission_handler_platform_interface: ^4.3.0

  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/corvia_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/corvia_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/corvia_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/corvia_icon_monochrome.png"

  web:
    generate: true
    image_path: "assets/icon/corvia_icon.png"
    background_color: "#0D1B2A"
    theme_color: "#00B4D8"

  windows:
    generate: true
    image_path: "assets/icon/corvia_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    # Public client configuration for plain `flutter run` in debug mode only.
    - .env
    - assets/fonts/Vera.ttf
    - assets/fonts/VeraBd.ttf
    - assets/fonts/bitstream-vera-license.txt
    - assets/icon/corvia_mark.png
    - assets/icon/corvia_mark.svg
    - assets/google.jpeg
    - assets/termsAndConditions.json
    - assets/policy.json
    - assets/animations/tLight_LabExplainLoader.json
    - assets/animations/mLight_LabExplainLoader.json
    - assets/animations/pLight_LabExplainLoader.json

  # Bitstream Vera is the bundled stand-in for Verdana on platforms without it
  # (web and Android), so the Verdana reading-font setting works everywhere.
  fonts:
    - family: BitstreamVera
      fonts:
        - asset: assets/fonts/Vera.ttf
        - asset: assets/fonts/VeraBd.ttf
          weight: 700

formatter:
  page_width: 120
